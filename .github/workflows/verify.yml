name: Verify desktop application

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      COSY_PROTOCOL_TESTS: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb libnss3 libasound2t64 libsecret-1-0
      - run: npm ci
      - run: python -m pip install -r tests/requirements.txt
      - run: npm run check
      - name: Windows desktop workflows
        if: runner.os == 'Windows'
        run: npm run test:desktop
      - name: Linux desktop workflows
        if: runner.os == 'Linux'
        env:
          COSY_TEST_DISABLE_SANDBOX: '1'
        run: xvfb-run -a npm run test:desktop
      - name: Build preview distribution packages
        run: npm run dist -- --publish never
      - name: Windows packaged application workflows
        if: runner.os == 'Windows'
        run: npm run test:packaged
      - name: Linux packaged application workflows
        if: runner.os == 'Linux'
        env:
          COSY_TEST_DISABLE_SANDBOX: '1'
        run: xvfb-run -a npm run test:packaged
      - name: Artifact checksums
        run: node scripts/checksums.cjs
      - uses: actions/upload-artifact@v7
        with:
          name: cosy-ftp-preview-${{ runner.os }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/SHA256SUMS.txt
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-screenshots-${{ runner.os }}
          path: .test-artifacts/desktop/*.png
          include-hidden-files: true
          retention-days: 7
