name: Verify Tauri application

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    # Includes exact source-package downloads and archive validation for distribution.
    timeout-minutes: 90
    env:
      COSY_PYTHON: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install stable Rust
        run: rustup update stable --no-self-update
      - name: Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update -qq
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config webkit2gtk-driver xvfb rpm dpkg-dev binutils
      - name: Windows SSH build prerequisites
        if: runner.os == 'Windows'
        run: |
          if (!(Test-Path 'C:\Strawberry\perl\bin\perl.exe')) { choco install strawberryperl --yes --no-progress }
          'PERL=C:\Strawberry\perl\bin\perl.exe' | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: npm ci
      - run: python -m pip install -r tests/requirements.txt
      - name: Native dependency notices and matching sources
        run: python scripts/native-notices.py
      - run: npm run check
      - name: Release artifact and approval contract
        run: node --test tests/release.test.cjs
      - run: npm run test:protocol
      - name: Build native preview packages
        run: npm run dist
      - name: Package checksums
        run: node scripts/checksums.cjs
      - name: Inventory Linux payload and collect exact system sources
        if: runner.os == 'Linux'
        run: python scripts/linux-distribution.py
      - name: Native Linux desktop workflows
        if: runner.os == 'Linux'
        # Xvfb has no GPU; keep WebKit away from accelerated compositing.
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
        run: |
          cargo install tauri-driver --locked
          dbus-run-session -- xvfb-run -a python scripts/tauri-smoke.py src-tauri/target/release/cosy-ftp
      - uses: actions/upload-artifact@v7
        with:
          name: cosy-ftp-tauri-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/SHA256SUMS.txt
            .test-artifacts/distribution/*
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tauri-desktop-checks-${{ runner.os }}
          path: .test-artifacts/tauri/
          include-hidden-files: true
          retention-days: 7
