name: Bug report
description: Report a reproducible Cosy FTP problem with disposable data.
body:
  - type: markdown
    attributes:
      value: 'Do not include passwords, private keys, tokens or editor recovery files. Report vulnerabilities privately through SECURITY.md.'
  - type: input
    id: version
    attributes:
      label: App version
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and package format
      placeholder: Windows 11 installer, Mint DEB, Fedora AppImage…
    validations:
      required: true
  - type: dropdown
    id: protocol
    attributes:
      label: Connection type
      options: [Local files, SFTP, FTPS, FTP, Other]
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include expected and actual behaviour, using disposable files and redacted paths.
    validations:
      required: true
