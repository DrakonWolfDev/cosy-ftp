[package]
name = "cosy-ftp"
version = "0.4.8"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["Andrew Hodgson"]
repository = "https://github.com/DrakonWolfDev/cosy-ftp"
description = "A calm two-pane file transfer client for Windows and Linux"

[lib]
name = "cosy_ftp_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.10"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
base64 = "0.22"
ssh2 = "0.9"
suppaftp = { version = "12", features = ["native-tls"] }
keyring = { version = "3", features = ["windows-native", "sync-secret-service"] }
directories = "6"
tempfile = "3"
anyhow = "1"
zeroize = "1"
same-file = "1"
dunce = "1"
openssl = "0.10"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
rustls-platform-verifier = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls"] }
semver = "1"
open = "5"


[target.'cfg(windows)'.dependencies]
ssh2 = { version = "0.9", features = ["openssl-on-win32", "vendored-openssl"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
glib = "0.18.5"

[patch.crates-io]
# Backport gtk-rs-core#1343 while GTK3/Tauri still require glib 0.18.
glib = { path = "vendor/glib" }
